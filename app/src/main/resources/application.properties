spring.application.name=oneroof

# AXHub injects PORT and probes over plain HTTP from outside the container.
server.port=${PORT:8080}
server.address=0.0.0.0

# Local development database (compose.dev.yaml). On AXHub, DATABASE_URL and DIRECT_DATABASE_URL
# replace these through AxhubDatabaseEnvironmentPostProcessor.
spring.datasource.url=jdbc:postgresql://localhost:54329/oneroof
spring.datasource.username=oneroof
spring.datasource.password=oneroof
spring.datasource.hikari.maximum-pool-size=5
# AXHub's pooler runs in transaction mode and cannot keep server-side prepared statements.
spring.datasource.hikari.data-source-properties.prepareThreshold=0

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Republish events whose listeners did not complete before the last shutdown.
spring.modulith.events.republish-outstanding-events-on-restart=true

# The scenario's "today". Every business rule reads the date from BusinessClock, never from the system clock.
oneroof.business-date=2026-07-01
oneroof.business-zone=Asia/Seoul

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
