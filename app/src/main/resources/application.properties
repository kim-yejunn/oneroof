spring.application.name=oneroof

# AXHub injects PORT and probes over plain HTTP from outside the container.
server.port=${PORT:8080}
server.address=0.0.0.0

# Local development database (compose.dev.yaml). On AXHub, DATABASE_URL and DIRECT_DATABASE_URL
# replace these through AxhubDatabaseEnvironmentPostProcessor.
spring.datasource.url=jdbc:postgresql://localhost:54329/oneroof
spring.datasource.username=oneroof
spring.datasource.password=oneroof
spring.datasource.hikari.maximum-pool-size=5
# AXHub's pooler runs in transaction mode and cannot keep server-side prepared statements.
spring.datasource.hikari.data-source-properties.prepareThreshold=0

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Module listeners run on a small fixed pool sized to the connection pool: three listener threads
# leave two of the five connections free for HTTP requests, and on a half-core container more
# threads would only wait for connections. Bulk work is carried in batch events, not more threads.
spring.task.execution.pool.core-size=3
spring.task.execution.pool.max-size=3
spring.task.execution.thread-name-prefix=module-

# Republish events whose listeners did not complete before the last shutdown.
spring.modulith.events.republish-outstanding-events-on-restart=true

# The scenario's "today". Every business rule reads the date from BusinessClock, never from the system clock.
oneroof.business-date=2026-07-01
oneroof.business-zone=Asia/Seoul

# P7 extension: set rebates off against receivables overdue by more than this many days, decided by
# finance. [교육용 가정] The threshold and the contract clause allowing the offset are assumptions.
oneroof.offset.enabled=true
oneroof.offset.overdue-days-over=90

# P8: who interprets agency replies for the reviewer. Replies are interpreted after they are
# applied; nothing waits on it. "rule" (default, no network) or "openai-compatible" (any provider with
# an OpenAI-style /chat/completions endpoint, e.g. the free Gemini tier).
oneroof.ai.provider=${ONEROOF_AI_PROVIDER:rule}
oneroof.ai.base-url=${ONEROOF_AI_BASE_URL:https://generativelanguage.googleapis.com/v1beta/openai}
oneroof.ai.model=${ONEROOF_AI_MODEL:gemini-3.5-flash-lite}
oneroof.ai.api-key=${ONEROOF_AI_API_KEY:}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

# API documentation: Swagger UI at /swagger-ui.html, OpenAPI document at /v3/api-docs.
springdoc.paths-to-match=/api/**
springdoc.default-produces-media-type=application/json
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.display-request-duration=true
