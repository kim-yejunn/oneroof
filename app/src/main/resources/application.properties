spring.application.name=oneroof

# AXHub injects PORT and probes over plain HTTP from outside the container.
server.port=${PORT:8080}
server.address=0.0.0.0

# The DataSource is built from DATABASE_URL in DatabaseConfig, so the app still starts without a database.
spring.autoconfigure.exclude=org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
